<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tuning — your voice</title>
<style>
  :root {
    --bg: #0a0c10;
    --ink: #e8e6e1;
    --dim: #6b7280;
    --line: #1b2029;
    --warm: #d9a066;
    --cool: #7aa2c4;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--ink);
    font: 400 16px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
    overscroll-behavior: none;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  header {
    padding: 18px 20px 8px;
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 12px; flex-wrap: wrap;
  }
  h1 {
    margin: 0; font-size: 13px; font-weight: 500;
    letter-spacing: .16em; text-transform: uppercase; color: var(--dim);
  }
  #rate {
    font-size: 11px; color: #4b5563; font-variant-numeric: tabular-nums;
    text-align: right;
  }

  #now { flex: 0 0 auto; text-align: center; padding: 6px 20px 2px; }
  #note {
    font-size: clamp(72px, 26vw, 150px); line-height: .95;
    font-weight: 200; letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    color: var(--dim); opacity: .28;
    transition: color .25s, opacity .25s;
  }
  #note.voiced { color: var(--warm); opacity: 1; }
  #hz {
    font-size: 15px; color: var(--dim); margin-top: 2px;
    font-variant-numeric: tabular-nums; min-height: 1.5em;
  }
  #quality {
    font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--cool); min-height: 1.4em; opacity: 0; transition: opacity .3s;
  }
  #quality.on { opacity: .85; }

  #meter {
    position: relative; height: 4px; margin: 10px auto 0; max-width: 320px;
    background: #151920; border-radius: 2px; overflow: hidden;
  }
  #meterFill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: var(--cool); opacity: .55; transition: width .06s linear;
  }
  #meterFill.over { background: var(--warm); opacity: .9; }
  #meterGate {
    position: absolute; top: -2px; bottom: -2px; width: 1px;
    background: var(--dim); left: 0;
  }
  #level {
    font-size: 10px; color: var(--dim); margin-top: 5px;
    font-variant-numeric: tabular-nums; min-height: 1.2em; opacity: .8;
  }

  #traceWrap { flex: 1 1 auto; position: relative; min-height: 130px; margin-top: 4px; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #log {
    flex: 0 0 32%; overflow-y: auto; padding: 10px 20px 4px;
    border-top: 1px solid var(--line);
    font: 400 13px/1.7 ui-monospace, "SF Mono", Menlo, monospace;
    -webkit-overflow-scrolling: touch;
  }
  #log div { opacity: .8; }
  #log div:first-child { color: var(--warm); opacity: 1; }
  #log .none { color: var(--dim); opacity: .5; }
  #log .mark { color: var(--dim); opacity: .7; }
  #log .mark.failed { color: var(--warm); }

  #field {
    padding: 8px 20px; border-top: 1px solid var(--line);
    font-size: 11px; letter-spacing: .06em; color: var(--cool);
    opacity: .75; min-height: 1.2em; text-align: center;
  }
  /* A quiet fact, not a dashboard: no colour that draws the eye, no motion. */
  #presence {
    padding: 0 20px 8px; font-size: 11px; letter-spacing: .04em;
    color: var(--dim); opacity: .65; min-height: 1.2em; text-align: center;
  }

  #choir {
    padding: 10px 20px; border-top: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px;
  }
  #listen {
    width: auto; flex: 0 0 auto; padding: 9px 16px; font-size: 12px;
    background: transparent; color: var(--dim);
    box-shadow: inset 0 0 0 1px var(--line);
  }
  #listen.on { color: var(--warm); box-shadow: inset 0 0 0 1px var(--warm); }
  #singing {
    flex: 1 1 auto; min-width: 0; font-size: 12px; color: var(--dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #singing b { color: var(--cool); font-weight: 500; }

  footer { padding: 10px 20px 16px; border-top: 1px solid var(--line); }
  button {
    width: 100%; padding: 16px; font-size: 16px; font-weight: 500; letter-spacing: .04em;
    color: var(--bg); background: var(--ink); border: 0; border-radius: 999px;
    cursor: pointer; transition: background .2s, color .2s, box-shadow .2s;
  }
  button.listening { background: transparent; color: var(--warm); box-shadow: inset 0 0 0 1px var(--warm); }
  button:disabled { opacity: .4; cursor: default; }
  #status { margin-top: 10px; font-size: 11px; color: var(--dim); text-align: center; min-height: 1.4em; }
  #status b { color: var(--cool); font-weight: 500; }
  #status .warn { color: var(--warm); }
</style>
</head>
<body>

<header>
  <h1>Tuning · your voice</h1>
  <span id="rate"></span>
</header>

<section id="now">
  <div id="note">—</div>
  <div id="hz"></div>
  <div id="quality"></div>
  <div id="meter"><div id="meterFill"></div><div id="meterGate"></div></div>
  <div id="level"></div>
</section>

<div id="traceWrap"><canvas id="trace"></canvas></div>

<div id="choir">
  <button id="listen">Hear the choir</button>
  <span id="singing">nine models are singing the same score</span>
</div>

<div id="field"></div>
<div id="presence"></div>

<div id="log"><div class="none">Sung breaths will appear here.</div></div>

<footer>
  <button id="btn">Open the microphone</button>
  <div id="status">Nothing is sent anywhere. The sound stays on this device.</div>
</footer>

<script src="pitch-core.js"></script>
<script>
// Wrapped in a function so this file's declarations live in their own scope.
// pitch-core.js is a plain script and puts TUNING and friends in the global
// lexical scope; a top-level `const TUNING` here would collide with it and the
// whole script would fail to instantiate — every line of it, silently.
(() => {
"use strict";

const els = {
  note: document.getElementById("note"),
  hz: document.getElementById("hz"),
  quality: document.getElementById("quality"),
  log: document.getElementById("log"),
  btn: document.getElementById("btn"),
  status: document.getElementById("status"),
  rate: document.getElementById("rate"),
  field: document.getElementById("field"),
  presence: document.getElementById("presence"),
  canvas: document.getElementById("trace"),
  meterFill: document.getElementById("meterFill"),
  meterGate: document.getElementById("meterGate"),
  level: document.getElementById("level"),
  listen: document.getElementById("listen"),
  singing: document.getElementById("singing"),
};

// There is no console on a phone, and a script that dies while loading leaves
// a button that simply does nothing. Put every failure on the screen instead.
function fail(msg) {
  els.status.innerHTML = `<span class="warn">${String(msg).slice(0, 300)}</span>`;
}
window.addEventListener("error", (e) => {
  const where = e.lineno ? ` (${(e.filename || "").split("/").pop()}:${e.lineno})` : "";
  fail((e.message || "Script error") + where);
});
window.addEventListener("unhandledrejection", (e) => fail(e.reason?.message || e.reason));

if (typeof PitchCore === "undefined") {
  fail("pitch-core.js did not load — the page cannot measure pitch.");
  throw new Error("PitchCore missing");
}
const { TUNING, GALLERY, yinFrame, hzToNote, centsOff, stabilityLabel,
        fieldLine, contourOf, galleryAdmits, median, stddev } = PitchCore;

// Wired up before anything else that could throw, so the button is never dead.
// start/stop/explain are function declarations, so they are already hoisted.
els.btn.addEventListener("click", async () => {
  if (running) { stop(); return; }
  els.btn.disabled = true;
  els.status.textContent = "Asking for the microphone…";
  try {
    await start();
  } catch (err) {
    els.status.innerHTML = explain(err);
    diagnose();
  } finally {
    els.btn.disabled = false;
  }
});

// --- which microphone this is ----------------------------------------------
//
// The same page serves two situations, and the gallery's is the harsher one.
// `?room=gallery` is the kiosk URL for the machine inside the cube at Gray
// Area: one open near-field microphone in a hall with nine other
// installations. Everything else — a phone anywhere in the world — is the
// default, and nothing about it changes.
//
// One page rather than two on purpose. A second implementation of listening
// would be a second set of thresholds, a second onset convention and a second
// idea of what a rest is, and the human halves of the score would stop being
// comparable in the one week they matter most (`modal/SCORE.md` §9). What the
// gallery gets is a stricter gate and a different account of who is singing,
// over the identical measurement.
const GALLERY_MODE = /(^|[?&])room=gallery(&|$)/.test(location.search || "");
const IDLE_LABEL = GALLERY_MODE ? "Open the room's microphone"
                                : "Open the microphone";

// human.py's fixed 0.025 gate assumes a microphone with automatic gain
// control. We switch AGC off on purpose — it is what preserves a held tone —
// so the raw signal can sit far below that and no breath is ever registered.
// Track the room's own noise floor instead and open the gate just above it.
//
// In the hall the same adaptive rule runs from much higher numbers: an
// absolute floor the room is not allowed to cross, and a wider margin over the
// floor it does have. See `GALLERY` in pitch-core.js for why each one.
const GATE_FLOOR = GALLERY_MODE ? GALLERY.GATE_FLOOR : 0.0035;
const GATE_CEIL = GALLERY_MODE ? GALLERY.GATE_CEIL : TUNING.VAD_RMS_THRESHOLD;
const GATE_OVER_NOISE = GALLERY_MODE ? GALLERY.GATE_OVER_NOISE : 3.5;
let noiseFloor = 0.01;
let gate = GATE_CEIL;

let ctx = null, stream = null, analyser = null, rawBuf = null, workBuf = null;
let running = false, raf = 0;
let workRate = TUNING.TARGET_RATE, decimation = 1;
let tauMin = 0, tauMax = 0, frameLen = 0;

// The utterance currently being sung.
let utterPitches = [], utterFrames = 0, utterStart = 0, lastVoiced = 0;
// The loudest frame in it. Only the room asks: a near-field microphone with
// somebody singing into it sits far above a hall that merely has people in it,
// and that difference is the one measurement that separates the two.
let utterPeak = 0;
let inUtterance = false;
let utterHeardChoir = false;   // the choir was audible while this was sung
// When this singer's previous breath stopped, on the audio clock. The rest
// between two of somebody's own breaths is theirs and is measured here rather
// than derived from arrival times on the server: the network is not part of the
// music. Reset with the audio context, whose clock starts again at zero.
let lastUtterEnd = 0;

const trace = [];
const TRACE_SECONDS = 18;

// --- the field -------------------------------------------------------------

// A stable but anonymous name for this device, so the field can tell singers
// apart without knowing who anyone is. Never leaves localStorage except as
// this opaque string.
//
// `human_` and not `voice_`, which is what this page used to mint. The choir's
// own nine are `voice_00`…`voice_08`, so a phone calling itself `voice_7f3a1b2c`
// collided with them and had to be renamed on the way into the listening
// window — which left the log holding one name for a person and the models
// holding another, and an arrow in the score pointing at a part that did not
// exist. One name from here on, and a stored old one is carried over rather
// than replaced, so a singer who comes back is the same part they were.
const DEVICE_ID = (() => {
  const key = "tuning.voice_id";
  const fresh = () => "human_" + Math.random().toString(36).slice(2, 10);
  // Private browsing and blocked storage make localStorage throw, not return
  // null. Falling back to a per-visit name keeps the page alive.
  try {
    let id = localStorage.getItem(key);
    if (id && id.startsWith("voice_")) id = "human_" + id.slice(6);
    if (!id) id = fresh();
    localStorage.setItem(key, id);
    return id;
  } catch {
    return fresh();
  }
})();

// Who is at the room's microphone. There is no login, no camera and no way to
// tell one visitor from the next, so "a person" is not a thing this data can
// support and the id does not pretend to be one. What the microphone can
// honestly report is a **turn at it**: sound arriving with gaps shorter than a
// minute and a half is one approach, and after a longer gap whoever it was has
// walked away. That may be one visitor or two friends passing the mic between
// them; `modal/SCORE.md` §9 says exactly that, and no more.
let roomTurn = "";
let roomTurnEnd = 0;      // audio clock, end of the last breath of this turn

function singerAt(onset) {
  if (!GALLERY_MODE) return DEVICE_ID;
  if (!roomTurn || (roomTurnEnd && onset - roomTurnEnd > GALLERY.SESSION_GAP_S)) {
    roomTurn = "human_room_" + Math.random().toString(16).slice(2, 6);
    // A new turn has no rest before it. The gap belongs to the room, not to
    // the person who has just walked up to the microphone.
    lastUtterEnd = 0;
  }
  return roomTurn;
}

// Breath onsets already accepted into the field, on the audio clock, for the
// one-minute ceiling. A cheap last defence: if the room ever starts singing
// into its own microphone, the field gains twenty lines and not a night's.
const accepted = [];

function flooding(now) {
  while (accepted.length && now - accepted[0] > 60) accepted.shift();
  return accepted.length >= GALLERY.MAX_BREATHS_PER_MIN
    ? "the microphone is flooding — held back" : "";
}

let fieldOnline = false;
let fieldSize = 0;
let fieldSince = null;   // ts of the first breath the field ever heard

// How full the room is, right now — nothing more. No map, no names, no
// locations: Iana was explicit that not-knowing-who-is-near is the piece, not
// a gap in it. `null` until the first answer arrives, so the line stays quiet
// rather than claiming a zero it has not yet measured.
let machinesNow = null;
let humansNow = null;

/** Is there a field behind this page, or is it running on its own? */
async function probeField() {
  try {
    const r = await fetch("field?limit=1", { cache: "no-store" });
    if (!r.ok) throw new Error(String(r.status));
    const d = await r.json();
    fieldOnline = true;
    fieldSize = d.size ?? 0;
    fieldSince = d.sounding_since ?? null;
    showField();
    if (typeof d.machines_now === "number") machinesNow = d.machines_now;
    if (typeof d.humans_now === "number") humansNow = d.humans_now;
    showPresence();
  } catch {
    fieldOnline = false;
  }
}

function showField() {
  if (!fieldOnline) return;
  if (!fieldSince) {
    els.field.textContent = "The field is empty. Yours would be the first breath.";
    return;
  }
  const since = new Date(fieldSince * 1000).toLocaleDateString(undefined,
    { day: "numeric", month: "short", year: "numeric" });
  els.field.textContent =
    `${fieldSize.toLocaleString()} breaths · sounding since ${since}`;
}

/** How many voices and how many people — a fact to sense, not a count to watch. */
function presenceLine(machines, humans) {
  const voices = machines > 0
    ? `${machines} voice${machines === 1 ? "" : "s"}`
    : "no voices";
  const people = humans > 0
    ? `${humans} ${humans === 1 ? "person" : "people"}`
    : "no one else";
  return `${voices} · ${people} in the field right now.`;
}

function showPresence() {
  if (!fieldOnline || machinesNow === null || humansNow === null) return;
  els.presence.textContent = presenceLine(machinesNow, humansNow);
}

/** Send one breath as numbers. The microphone signal never goes anywhere. */
async function postBreath(payload) {
  if (!fieldOnline) return false;
  try {
    const r = await fetch("breath", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        voice_id: DEVICE_ID,
        // Where this was sung, which the score keeps because it is the
        // difference between somebody on a phone in another country and
        // somebody standing in the room with the choir in the week it dies.
        source: GALLERY_MODE ? "gallery" : "portal",
        ...payload,
      }),
      keepalive: true,
    });
    if (!r.ok) return false;
    const d = await r.json();
    if (typeof d.field_size === "number") fieldSize = d.field_size;
    if (d.sounding_since) fieldSince = d.sounding_since;
    showField();
    return true;
  } catch {
    return false;
  }
}

// --- the choir, aloud ------------------------------------------------------
//
// The field is not only somewhere to write: it is something to tune to. Each
// utterance is rendered to one wav on the server — a tone at the pitch the
// model named, its words spoken over it — and played here in the order it
// happened, so a listener in Venice and a listener in Berlin hear the same
// nine voices.
//
// Two rules keep a room from feeding back on itself, because echo cancellation
// is switched off on purpose here. Nothing new starts while someone is holding
// a note, so the choir never sings over a singer. And a breath that overlapped
// the choir is not sent, because otherwise a laptop's own speakers get
// measured and the field slowly fills with the choir singing to itself under a
// human name. Headphones make both rules invisible.

let hearing = false;        // has this listener asked for the choir
let sounding = false;       // is an utterance playing right now
let voicedNow = false;      // is someone holding a note
let voicedSince = 0;        // when the current run of voiced frames began
let heardUpTo = 0;          // ts of the newest utterance already queued
const toPlay = [];
// One element for the whole session, primed inside the click below. Safari
// grants playback to an element it was handed during a gesture, not to the
// page, and every utterance after the first is started from a fetch callback
// with no gesture anywhere near it — a fresh `new Audio` per breath is refused.
let player = null;
let blocked = false;        // the browser refused to start audio at all
let fieldSynced = false;    // the first poll is history, not the room now

// People, sounded from their numbers. `/breath` refuses audio by design and no
// recording is kept anywhere, so nothing of anybody's voice can be played back
// — but the measurement is enough to make one: the pitch, the glide it took,
// and how long it lasted. The tone is built here, in the listener's own
// browser, out of what the log already says. A field with people in it can
// then be heard as people, with no voice having left the phone that sang.
let outCtx = null;          // playback only; the microphone keeps its own
let tonesPlaying = 0;       // synthesised tones audible right now

function soundHuman(e) {
  if (!hearing || !outCtx || !outCtx.createOscillator) return;
  if (!(e.hz > 0) || holdingNote()) return;
  const dur = Math.min(12, Math.max(0.25, e.dur || 0.6));
  const at = outCtx.currentTime;

  const osc = outCtx.createOscillator();
  const gain = outCtx.createGain();
  osc.type = "sine";

  const pts = (e.contour || []).filter((v) => v > 0);
  if (pts.length > 1) {
    // The line the voice actually walked, not a flat median of it. This is the
    // whole difference between hearing a person and hearing a tuning fork.
    osc.frequency.setValueCurveAtTime(Float32Array.from(pts), at, dur);
  } else {
    osc.frequency.setValueAtTime(e.hz, at);
  }

  // Eased at both ends: a square edge here would be the loudest thing in the
  // field, and the field is a meditation.
  const peak = 0.18;
  gain.gain.setValueAtTime(0.0001, at);
  gain.gain.exponentialRampToValueAtTime(peak, at + 0.08);
  gain.gain.setValueAtTime(peak, at + Math.max(0.09, dur - 0.12));
  gain.gain.exponentialRampToValueAtTime(0.0001, at + dur);

  osc.connect(gain).connect(outCtx.destination);
  tonesPlaying++;
  osc.onended = () => { tonesPlaying = Math.max(0, tonesPlaying - 1); };
  osc.start(at);
  osc.stop(at + dur + 0.02);
}

async function pollField() {
  // A page opened while the portal was restarting used to give up for good:
  // the probe at load failed, and this returned on its first line forever
  // after. Ask again instead — the field is polled every five seconds anyway,
  // and a listener on a bad connection should recover by waiting, not by
  // knowing to reload.
  if (!fieldOnline) {
    await probeField();
    if (!fieldOnline) return;
  }
  try {
    const r = await fetch(heardUpTo ? `field?since=${heardUpTo}` : "field?limit=4",
                          { cache: "no-store" });
    if (!r.ok) throw new Error(String(r.status));
    const d = await r.json();
    if (typeof d.size === "number") fieldSize = d.size;
    if (d.sounding_since) fieldSince = d.sounding_since;
    showField();
    if (typeof d.machines_now === "number") machinesNow = d.machines_now;
    if (typeof d.humans_now === "number") humansNow = d.humans_now;
    showPresence();
    for (const e of d.recent || []) {
      if (e.ts > heardUpTo) heardUpTo = e.ts;
      // A short queue on purpose: arriving late should drop you into the field
      // as it is now, not replay the minutes you missed.
      if (e.audio && toPlay.length < 6) toPlay.push(e);
      // People sound as they arrive rather than waiting their turn, because
      // that is what a room does — and because breaths from a phone are short
      // and frequent, and queued behind the choir they would only ever be
      // heard late, if at all. Never your own: you have already heard it.
      else if (fieldSynced && e.who === "human" && e.voice_id !== DEVICE_ID) {
        soundHuman(e);
      }
    }
    fieldSynced = true;
    playNext();
  } catch { /* the field will still be there in five seconds */ }
}

// Whether somebody is holding a note *now*, as opposed to sitting in a room the
// microphone finds loud. A laptop in a café stays above the gate indefinitely,
// and a plain `voicedNow` check would then suppress the choir forever without
// ever saying so. No note outlasts MAX_UTTERANCE_S, so neither does the hush.
function holdingNote() {
  if (!voicedNow) return false;
  return (ctx ? ctx.currentTime : 0) - voicedSince < TUNING.MAX_UTTERANCE_S;
}

function playNext() {
  if (!hearing || sounding || holdingNote() || !toPlay.length) return;
  const e = toPlay.shift();
  sounding = true;

  els.singing.textContent = "";
  const who = document.createElement("b");
  who.textContent = e.name;
  els.singing.append(who, " " + (e.text || "").slice(0, 90));

  // Whether this answered somebody or began something. It is the one thing the
  // piece is actually about, and it was in the log and on no screen.
  const how = e.action === "TUNE"
    ? (e.tuning_to ? `tuning to ${e.tuning_to}` : "tuning")
    : e.action === "NEW" ? "new" : "";
  if (how) {
    const tag = document.createElement("span");
    tag.className = "mark";
    tag.textContent = " · " + how;
    els.singing.append(tag);
  }

  if (!player) player = new Audio();
  player.src = "audio/" + e.audio;
  const done = () => { sounding = false; setTimeout(playNext, 600); };
  player.onended = done;
  player.onerror = done;
  const started = player.play();
  if (started && started.catch) started.catch((err) => { refused(err); done(); });
}

/** A refusal that used to be swallowed, leaving a page that looked like it was
 *  working and made no sound. Said once: the retry loop would repeat it. */
function refused(err) {
  if (blocked) return;
  blocked = true;
  els.singing.textContent = "";
  const warn = document.createElement("span");
  warn.className = "warn";
  warn.textContent = (err && err.name === "NotAllowedError")
    ? "This browser will not start sound on its own — press “Hear the choir” again."
    : "The choir could not be played here.";
  els.singing.append(warn);
}

// An empty wav — a header and no samples — played inside the click that asked
// for the choir. Nothing is heard; what it buys is an element the browser has
// already allowed to make sound, so the first real breath, which arrives
// seconds later out of a timer, is not refused for want of a gesture.
const SILENCE =
  "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";

function prime() {
  if (!player) player = new Audio();
  // The context that sounds people. Built in the click for the same reason as
  // the player: a browser lets a gesture start audio and a timer not.
  if (!outCtx) {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    try { outCtx = new Ctx(); } catch { outCtx = null; }
  }
  if (outCtx && outCtx.resume) outCtx.resume().catch(() => {});
  if (sounding) return;                 // already allowed, and already singing
  player.src = SILENCE;
  const started = player.play();
  if (started && started.catch) started.catch(() => {});
}

els.listen.addEventListener("click", () => {
  // Not in the room. There the choir comes out of sixteen speakers on the
  // cube, and a kiosk playing it as well would be a microphone listening to
  // its own machine — the feedback this page switched echo cancellation off to
  // avoid. The button is hidden in gallery mode; this is the second lock.
  if (GALLERY_MODE) return;
  hearing = !hearing;
  els.listen.classList.toggle("on", hearing);
  els.listen.textContent = hearing ? "The choir is on" : "Hear the choir";
  if (hearing) {
    blocked = false;
    prime();
    playNext();
  } else if (player) {
    player.pause();
    sounding = false;
    els.singing.textContent = "nine models are singing the same score";
  }
});

// --- capture ---------------------------------------------------------------

// Every one of these is off on purpose. Browser noise suppression is a
// speech model: it hears a sustained vowel and the tone of a room as noise
// and removes exactly the material this piece is made of. If a browser
// refuses the raw ask we would still rather have the microphone than nothing,
// so we walk down to plainer constraints and say so afterwards.
const CONSTRAINTS = [
  { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 },
  { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
  true,
];

async function openMicrophone() {
  let lastErr = null;
  for (const audio of CONSTRAINTS) {
    try {
      return await navigator.mediaDevices.getUserMedia({ audio });
    } catch (err) {
      lastErr = err;
      // A refusal or a missing device will not be fixed by asking for less.
      if (err.name === "NotAllowedError" || err.name === "NotFoundError") throw err;
    }
  }
  throw lastErr;
}

async function start() {
  if (!window.isSecureContext) {
    throw new Error("insecure-context");
  }
  if (!navigator.mediaDevices?.getUserMedia) {
    throw new Error("no-getusermedia");
  }

  // Safari ties microphone and audio permission to the click that started
  // this, and an await before constructing the AudioContext can lose that
  // gesture — so build it first and tear it down again if the mic fails.
  const Ctx = window.AudioContext || window.webkitAudioContext;
  try {
    ctx = new Ctx({ sampleRate: TUNING.TARGET_RATE });
  } catch {
    ctx = new Ctx();          // Safari may refuse a non-native rate
  }
  // A new context restarts the clock the rests are measured on, so the first
  // breath after the microphone is reopened has no measurable before. Sending
  // nothing is right: the gap really is unknown, and the log should not guess.
  lastUtterEnd = 0;
  // And a reopened microphone is a new turn at it. Whoever was singing before
  // the room's machine was restarted is not whoever is standing there now.
  roomTurn = "";
  roomTurnEnd = 0;
  accepted.length = 0;

  try {
    stream = await openMicrophone();
  } catch (err) {
    ctx.close();
    ctx = null;
    throw err;
  }
  await ctx.resume();

  // Work near 16 kHz whatever the hardware gives us: YIN costs
  // O(tauMax x frame), which at 48 kHz is nine times the work for no
  // extra accuracy on a sung voice.
  decimation = Math.max(1, Math.round(ctx.sampleRate / TUNING.TARGET_RATE));
  workRate = ctx.sampleRate / decimation;

  analyser = ctx.createAnalyser();
  analyser.fftSize = 4096;     // ≥ 50 ms of audio even at 48 kHz
  analyser.smoothingTimeConstant = 0;
  ctx.createMediaStreamSource(stream).connect(analyser);

  rawBuf = new Float32Array(analyser.fftSize);
  workBuf = new Float32Array(Math.ceil(analyser.fftSize / decimation));
  frameLen = Math.floor(workRate * TUNING.FRAME_S);
  tauMin = Math.floor(workRate / TUNING.PITCH_FMAX_HZ);
  tauMax = Math.floor(workRate / TUNING.PITCH_FMIN_HZ);

  reportSettings();
  els.rate.textContent = `${(ctx.sampleRate / 1000).toFixed(0)} → ${(workRate / 1000).toFixed(1)} kHz`;

  running = true;
  els.btn.textContent = "Listening — tap to stop";
  els.btn.classList.add("listening");
  loop();
}

function stop() {
  running = false;
  cancelAnimationFrame(raf);
  if (inUtterance) emitUtterance();
  if (stream) stream.getTracks().forEach((t) => t.stop());
  if (ctx) ctx.close();
  ctx = stream = analyser = null;
  els.btn.textContent = IDLE_LABEL;
  els.btn.classList.remove("listening");
  els.note.textContent = "—";
  els.note.classList.remove("voiced");
  els.hz.textContent = "";
  els.quality.classList.remove("on");
}

/** Tell the singer whether the browser actually honoured the raw-audio ask. */
function reportSettings() {
  const s = stream.getAudioTracks()[0].getSettings?.() ?? {};
  const kept = [];
  if (s.noiseSuppression) kept.push("noise suppression");
  if (s.autoGainControl) kept.push("auto gain");
  if (s.echoCancellation) kept.push("echo cancellation");
  els.status.innerHTML = kept.length
    ? `<span class="warn">This browser kept ${kept.join(" and ")} on.</span> Held tones may be thinned.`
    : `Raw microphone: <b>no noise suppression, no auto gain</b>. Sound stays on this device.`;
}

/** Box-filter and decimate in one pass — crude anti-aliasing, cheap enough. */
function downsample(src, dst, factor) {
  const n = Math.floor(src.length / factor);
  for (let i = 0; i < n; i++) {
    let sum = 0;
    const base = i * factor;
    for (let k = 0; k < factor; k++) sum += src[base + k];
    dst[i] = sum / factor;
  }
  return n;
}

// --- analysis loop ---------------------------------------------------------

function loop() {
  if (!running) return;
  raf = requestAnimationFrame(loop);

  analyser.getFloatTimeDomainData(rawBuf);

  let work, n;
  if (decimation > 1) { n = downsample(rawBuf, workBuf, decimation); work = workBuf; }
  else { n = rawBuf.length; work = rawBuf; }
  if (n < frameLen) return;
  const frame = work.subarray(n - frameLen, n);

  let peak = 0, sumsq = 0;
  for (let i = 0; i < frame.length; i++) {
    const v = frame[i];
    const a = v < 0 ? -v : v;
    if (a > peak) peak = a;
    sumsq += v * v;
  }
  const rms = Math.sqrt(sumsq / frame.length);
  const now = ctx.currentTime;

  // Follow the room: fall to quiet quickly, rise slowly, so a sustained note
  // never gets mistaken for the noise floor it has to be measured against.
  noiseFloor = rms < noiseFloor
    ? noiseFloor * 0.90 + rms * 0.10
    : noiseFloor * 0.9995 + rms * 0.0005;
  gate = Math.min(GATE_CEIL, Math.max(GATE_FLOOR, noiseFloor * GATE_OVER_NOISE));

  let hz = 0;
  if (peak >= GATE_FLOOR) {
    hz = yinFrame(frame, workRate, tauMin, tauMax);
    if (hz < TUNING.PITCH_FMIN_HZ || hz > TUNING.PITCH_FMAX_HZ) hz = 0;
  }
  const voiced = rms >= gate;
  showLevel(rms, gate, voiced);

  // Let a held note finish before the choir answers it.
  if (voiced && !voicedNow) voicedSince = now;
  if (voicedNow && !voiced) setTimeout(playNext, 300);
  voicedNow = voiced;

  if (voiced) {
    if (!inUtterance) {
      inUtterance = true; utterStart = now; utterPitches = []; utterFrames = 0;
      utterHeardChoir = false; utterPeak = 0;
    }
    // The choir, or another person sounded from their numbers: either way it
    // came out of these speakers and back down this microphone, and a breath
    // that contains it is not this singer's.
    if (sounding || tonesPlaying) utterHeardChoir = true;
    lastVoiced = now;
    utterFrames++;
    if (rms > utterPeak) utterPeak = rms;
    if (hz > 0) utterPitches.push(hz);
    if (now - utterStart >= TUNING.MAX_UTTERANCE_S) emitUtterance();
  } else if (inUtterance && now - lastVoiced >= TUNING.SILENCE_TAIL_S) {
    emitUtterance();
  }

  setNote(hz, voiced);
  trace.push({ t: now, hz: voiced ? hz : 0 });
  while (trace.length && now - trace[0].t > TRACE_SECONDS) trace.shift();
  draw(now);
}

function emitUtterance() {
  const dur = lastVoiced - utterStart;
  const pitches = utterPitches;
  const frames = utterFrames;
  const peak = utterPeak;
  // How long ago the sound stopped. The page waits out half a second of silence
  // before it believes a note is over, so without this every onset in the score
  // would sit half a second late — a fixed error, in the one dimension the
  // piece is about, that nothing downstream could ever detect or undo.
  const tail = Math.max(0, (ctx ? ctx.currentTime : lastVoiced) - lastVoiced);
  inUtterance = false;
  utterPitches = [];
  utterPeak = 0;
  if (dur < TUNING.MIN_UTTERANCE_S || pitches.length === 0) return;

  const med = median(pitches);
  const sd = stddev(pitches);
  const voicedFrac = pitches.length / Math.max(1, frames);

  // This is exactly the line human.py puts into the shared field.
  const first = els.log.querySelector(".none");
  if (first) first.remove();
  const div = document.createElement("div");
  div.textContent = `${fieldLine(med, sd)}  ${dur.toFixed(1)}s`;
  const mark = document.createElement("span");
  mark.className = "mark";
  mark.textContent = fieldOnline ? " sending…" : " on this device";
  div.append(mark);
  els.log.prepend(div);
  while (els.log.children.length > 60) els.log.lastChild.remove();

  // Heard through the speakers rather than sung: keep it out of the field.
  if (utterHeardChoir) {
    mark.textContent = " the choir was in the microphone — not sent";
    mark.classList.add("failed");
    return;
  }

  // In the hall, everything that is not clearly a person singing into the
  // microphone stops here and is written nowhere. The reason is printed, which
  // is how the gate gets set against the real room during install.
  if (GALLERY_MODE) {
    const refused = galleryAdmits({
      durationS: dur, voicedFraction: voicedFrac,
      medianHz: med, stdHz: sd, peakRms: peak,
    }) || flooding(lastVoiced);
    if (refused) {
      mark.textContent = ` ${refused}`;
      mark.classList.add("failed");
      return;
    }
  }

  // Who sang it. On a phone, this device; in the hall, whoever is currently at
  // the microphone — and asking may open a new turn, which clears the rest
  // before, so it is asked before that rest is measured.
  const singer = singerAt(utterStart);
  const restBefore = lastUtterEnd > 0 ? Math.max(0, utterStart - lastUtterEnd) : null;

  // This breath is now the one the next rest is measured from, whether or not
  // the field is online: a singer alone on a bad connection still has a rhythm.
  lastUtterEnd = lastVoiced;
  roomTurnEnd = lastVoiced;
  accepted.push(lastVoiced);

  if (fieldOnline) {
    postBreath({
      voice_id: singer,
      note: hzToNote(med),
      hz: med,
      cents: centsOff(med),
      stability: stabilityLabel(sd, med),
      duration_s: dur,
      voiced_fraction: voicedFrac,
      // The score's four additions. Measurements, all of them, and still no
      // audio: a spread, a trace of the pitch, and the two times that place
      // the note and this singer's own rest before it. See modal/SCORE.md.
      std_hz: sd,
      contour_hz: contourOf(pitches, dur),
      tail_s: tail,
      own_rest_s: restBefore,
    }).then((ok) => {
      mark.textContent = ok ? " left in the field" : " not sent";
      mark.classList.toggle("failed", !ok);
    });
  }
}

/** Input level against the gate, so a silent microphone is visibly silent. */
const dbPercent = (v) => {
  const db = 20 * Math.log10(Math.max(v, 1e-6));   // -60 dB … 0 dB across the bar
  return Math.max(0, Math.min(100, ((db + 60) / 60) * 100));
};

function showLevel(rms, gateRms, voiced) {
  els.meterFill.style.width = dbPercent(rms).toFixed(1) + "%";
  els.meterFill.classList.toggle("over", voiced);
  els.meterGate.style.left = dbPercent(gateRms).toFixed(1) + "%";
  els.level.textContent =
    `input ${(20 * Math.log10(Math.max(rms, 1e-6))).toFixed(0)} dB · ` +
    `opens at ${(20 * Math.log10(gateRms)).toFixed(0)} dB`;
}

function setNote(hz, voiced) {
  if (hz > 0 && voiced) {
    const c = centsOff(hz);
    els.note.textContent = hzToNote(hz);
    els.note.classList.add("voiced");
    els.hz.textContent = `${hz.toFixed(1)} Hz  ·  ${c >= 0 ? "+" : ""}${c} cents`;
    els.quality.textContent = Math.abs(c) <= 5 ? "in tune" : c > 0 ? "sharp" : "flat";
    els.quality.classList.add("on");
  } else {
    els.note.classList.remove("voiced");
    els.quality.classList.remove("on");
    if (!voiced) { els.note.textContent = "—"; els.hz.textContent = ""; }
  }
}

// --- trace -----------------------------------------------------------------

const cv = els.canvas;
const g = cv.getContext("2d");

function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, r.width * dpr);
  cv.height = Math.max(1, r.height * dpr);
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resize).observe(cv);
resize();

const LO = 80, HI = 900;
const yFor = (hz, h) => h - (Math.log2(hz / LO) / Math.log2(HI / LO)) * h;

function draw(now) {
  const r = cv.getBoundingClientRect();
  const w = r.width, h = r.height;
  g.clearRect(0, 0, w, h);

  // The equal-tempered ladder, C and A only, to sing against.
  g.font = "10px ui-monospace, Menlo, monospace";
  for (let midi = 36; midi <= 84; midi++) {
    const semi = midi % 12;
    if (semi !== 0 && semi !== 9) continue;
    const hz = 440 * Math.pow(2, (midi - 69) / 12);
    if (hz < LO || hz > HI) continue;
    const y = yFor(hz, h);
    g.strokeStyle = semi === 0 ? "#1b2029" : "#151920";
    g.lineWidth = 1;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    g.fillStyle = "#333b47";
    g.fillText(hzToNote(hz), 6, y - 3);
  }

  const t0 = now - TRACE_SECONDS;
  let pen = false;
  g.lineWidth = 2.5;
  g.lineJoin = "round";
  g.strokeStyle = "#d9a066";
  g.beginPath();
  for (const p of trace) {
    if (!p.hz) { pen = false; continue; }
    const x = ((p.t - t0) / TRACE_SECONDS) * w;
    const y = yFor(Math.min(HI, Math.max(LO, p.hz)), h);
    if (pen) g.lineTo(x, y); else { g.moveTo(x, y); pen = true; }
  }
  g.stroke();

  const last = trace[trace.length - 1];
  if (last && last.hz) {
    const x = ((last.t - t0) / TRACE_SECONDS) * w;
    const y = yFor(Math.min(HI, Math.max(LO, last.hz)), h);
    g.fillStyle = "#d9a066";
    g.beginPath(); g.arc(x, y, 4, 0, Math.PI * 2); g.fill();
  }
}

// --- wiring ----------------------------------------------------------------

/** Say what went wrong in words that point at the fix. */
function explain(err) {
  const where = `${location.protocol}//${location.hostname}`;
  switch (err.message === "insecure-context" ? "insecure" :
          err.message === "no-getusermedia" ? "missing" : err.name) {
    case "insecure":
      return `<span class="warn">This page is not a secure context</span> (${where}).
              A microphone only opens over https, or on localhost.`;
    case "missing":
      return `<span class="warn">This browser exposes no getUserMedia</span> at ${where}.`;
    case "NotAllowedError":
      return `<span class="warn">Permission refused.</span> Two places to check:
              the padlock in the address bar for this site, and
              <b>System Settings → Privacy &amp; Security → Microphone</b>,
              where your browser itself needs the tick. macOS asks once and
              then silently refuses forever.`;
    case "NotFoundError":
      return `<span class="warn">No input device.</span> The browser sees no microphone at all.`;
    case "NotReadableError":
      return `<span class="warn">The microphone is there but cannot be read.</span>
              Usually another app is holding it, or the browser is missing the
              tick in <b>System Settings → Privacy &amp; Security → Microphone</b>.`;
    case "OverconstrainedError":
      return `<span class="warn">No device matches the request</span>
              (${err.constraint || "unknown constraint"}).`;
    case "SecurityError":
      return `<span class="warn">Blocked by policy.</span> Microphone access is
              disabled for ${where}.`;
    default:
      return `<span class="warn">${err.name || "Error"}:</span> ${err.message}`;
  }
}

/** A one-line report of the things that usually explain a silent microphone. */
async function diagnose() {
  const bits = [`${location.protocol}//${location.hostname}`];
  bits.push(window.isSecureContext ? "secure" : "NOT secure");
  try {
    const p = await navigator.permissions.query({ name: "microphone" });
    bits.push(`permission: ${p.state}`);
  } catch { /* Safari has no permission query for the microphone */ }
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    bits.push(`${devices.filter((d) => d.kind === "audioinput").length} input(s)`);
  } catch { /* nothing to add */ }
  els.rate.textContent = bits.join(" · ");
}
// --- the room ---------------------------------------------------------------

/** Turn this copy of the page into the microphone in the cube. */
function beTheRoom() {
  document.title = "Tuning · the room";
  const h1 = document.querySelector("h1");
  if (h1) h1.textContent = "Tuning \u00b7 the microphone in the room";
  els.btn.textContent = IDLE_LABEL;
  // The choir is already in the hall, out of sixteen speakers. Nothing here
  // may play it, so the button that would is not on the page at all.
  els.listen.hidden = true;
  els.listen.style.display = "none";
  els.singing.textContent = "the choir is in the room, not in this page";
  els.status.innerHTML =
    "Hold the button on the microphone and sing. Only numbers leave the room: " +
    "a pitch, a length and a silence. <b>No sound is recorded.</b>";

  // A gallery opens at one o'clock and nobody comes back to press a button.
  // The permission survives on the kiosk's origin, so after the first day this
  // starts on its own; on the first day the staff press it once, which is the
  // "one action, one button" the run-of-show already asks of them
  // (`modal/EXHIBITION.md` §5). If the microphone is pulled out or the browser
  // drops the stream, we take it again rather than losing the afternoon.
  const wake = () => {
    if (running) return;
    start().catch(() => { /* no permission yet — the button is still there */ });
  };
  wake();
  setInterval(() => {
    if (!running) { wake(); return; }
    const track = stream && stream.getAudioTracks ? stream.getAudioTracks()[0] : null;
    if (!track || track.readyState !== "live") { stop(); wake(); }
  }, 15000);
}

diagnose();
probeField();
// Polled whether or not the choir is audible here, so the page can always say
// how large the field is and how long it has been sounding.
setInterval(pollField, 5000);
if (GALLERY_MODE) beTheRoom();
})();
</script>
</body>
